<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QBLint</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>QBLint</h1>
      <p class="subtitle">Quizbowl Packet Style Checker</p>
    </header>

    <div id="upload-area">
      <div id="drop-zone">
        <p>Drop .docx files or a folder here</p>
        <p class="or">or</p>
        <div class="upload-buttons">
          <label class="file-btn">
            Choose Files
            <input type="file" id="file-input" accept=".docx" multiple hidden>
          </label>
          <label class="file-btn file-btn-secondary">
            Choose Folder
            <input type="file" id="folder-input" webkitdirectory hidden>
          </label>
        </div>
      </div>
    </div>

    <div id="results-area" hidden>
      <div id="file-info">
        <span id="file-name"></span>
        <button id="clear-btn" title="Clear">&#x2715;</button>
      </div>

      <div id="packet-nav" hidden>
        <button id="prev-btn" title="Previous packet">&lsaquo;</button>
        <select id="packet-select"></select>
        <button id="next-btn" title="Next packet">&rsaquo;</button>
        <span id="packet-counter"></span>
      </div>

      <div id="stats-bar">
        <button class="stat stat-error active" data-severity="error"><span id="count-error">0</span> errors</button>
        <button class="stat stat-warning active" data-severity="warning"><span id="count-warning">0</span> warnings</button>
        <button class="stat stat-info active" data-severity="info"><span id="count-info">0</span> info</button>
      </div>

      <div id="filters">
        <select id="filter-category">
          <option value="all">All categories</option>
          <option value="packet">Packet structure</option>
          <option value="question">Question text</option>
          <option value="answerline">Answer lines</option>
          <option value="pronunciation">Pronunciation</option>
          <option value="formatting">Formatting</option>
          <option value="tag">Tags</option>
          <option value="writing">Writing style</option>
        </select>
      </div>

      <div id="diagnostics-list"></div>

      <div id="no-issues" hidden>
        <p>No issues found.</p>
      </div>
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
